name: Publish HVFS to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvfs-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Pull, deploy, and verify live pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          token = os.environ.get("CPANEL_API_TOKEN", "")
          if not token:
              raise SystemExit("Add the CPANEL_API_TOKEN repository secret before publishing.")
          base = "https://server400.web-hosting.com:2083/execute/"
          root = "/home/hvfacgpk/repositories/HVFS"
          def api(endpoint, **params):
              url = base + endpoint + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": "cpanel hvfacgpk:" + token})
              with urllib.request.urlopen(req, timeout=90) as response:
                  payload = json.load(response)
                  result = payload.get("result", payload)
              if result.get("status") != 1:
                  raise RuntimeError(endpoint + " failed: " + str(result.get("errors")))
              return result.get("data")
          sha = os.environ["EXPECTED_SHA"]
          pages = ["index.html", "events.html", "leadership.html", "resources.html"]
          expected = {}
          for page in pages:
              with urllib.request.urlopen("https://raw.githubusercontent.com/ekwak22/HVFS/" + sha + "/" + page, timeout=30) as response:
                  expected[page] = response.read()
          api("VersionControl/update", repository_root=root, branch="main")
          api("VersionControlDeployment/create", repository_root=root)
          print("Deployment requested. Checking all four live HTML pages.")
          pending = set(pages)
          for attempt in range(36):
              for page in list(pending):
                  req = urllib.request.Request("https://hvfarmlandstewards.org/" + page + "?deploy=" + sha,
                                               headers={"Cache-Control": "no-cache"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.read() == expected[page]:
                              pending.remove(page)
                              print("Verified " + page)
                  except Exception as error:
                      print("Waiting for " + page + ": " + type(error).__name__)
              if not pending:
                  print("Deployment verified successfully.")
                  break
              time.sleep(5)
          else:
              raise SystemExit("Live pages did not match this commit: " + ", ".join(sorted(pending)))
          PY
